<!--The content below is only a placeholder and can be replaced.-->
<div class="card-container text-center">
  <a [routerLink]="['/home']" class="logo google-sans-regular">
    <img src="assets/images/pcc-logo.png" alt="Logo" width="100" />
    <span class="google-sans-bold">PCCian's Guide</span>
  </a>
  <br>
  <br>
  <mat-card>
    <img src="assets/images/home.jpg" class="banner" />
    <mat-card-content class="text-left">
      <h1 class="google-sans-bold">
        Search Type
      </h1>
      <div class="text-center">
        <button mat-raised-button color="primary" class="cta start" [routerLink]="['/quick-search']">Quick
          Search</button>
        <br>
        <button mat-raised-button color="primary" class="cta start" [routerLink]="['/search-result']"
          [queryParams]="{ isAll: 1 }">All
          Locations</button>
      </div>
      <div></div>
    </mat-card-content>
  </mat-card>

</div>
