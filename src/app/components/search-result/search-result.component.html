<!--The content below is only a placeholder and can be replaced.-->
<div style="text-align:center" class="card-container">
  <a [routerLink]="['/home']" class="logo google-sans-regular">
    <img src="assets/images/pcc-logo.png" alt="Logo" width="100" />
    <span class="google-sans-bold">PCCian's Guide</span>
  </a>
  <br>
  <br>
  <mat-card>
    <img src="assets/images/search.jpg" class="banner" />
    <mat-card-content class="text-left">
      <h1 class="google-sans-bold">
        {{ pageTitle }}
      </h1>
      <table mat-table [dataSource]="locations" class="search-result">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="hide"></th>
          <td mat-cell *matCellDef="let element">
            <a [routerLink]="['/quick-search']" class="location-link">
              {{element.name}}
              <span>Visit <i class="fa-solid fa-chevron-right"></i></span></a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <br>
      <div></div>
    </mat-card-content>
  </mat-card>

</div>
