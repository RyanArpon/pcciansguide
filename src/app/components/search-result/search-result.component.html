<!--The content below is only a placeholder and can be replaced.-->
<div style="text-align:center" class="card-container">
  <a [routerLink]="['/home']" class="logo google-sans-regular">
    <img src="assets/images/pcc-logo.png" alt="Logo" width="100" />
    <span class="google-sans-bold">PCCian's Guide</span>
  </a>
  <br>
  <br>
  <mat-card>
    <img src="assets/images/search.jpg" class="banner" />
    <mat-card-content class="text-left">
      <a [routerLink]="['/search-type']"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <h1 class="google-sans-bold">
        {{ pageTitle }}
      </h1>

      <ng-container *ngIf="length; else noResult">
        <table mat-table [dataSource]="locations" class="search-result">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="hide"></th>
            <td mat-cell *matCellDef="let element">
              <a [routerLink]="['/location']" [queryParams]="{ id: element.id }" class="location-link">
                {{element.name}}
                <span>Visit <i class="fa-solid fa-arrow-right"></i></span></a>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <br>
        <mat-paginator [length]="length" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
          (page)="handlePageEvent($event)">
        </mat-paginator>
      </ng-container>

      <ng-template #noResult>
        <div class="text-center">
          <i class="fa-regular fa-face-meh"></i>
          <br>
          <br>
          <strong class="text-center">No result found.</strong>
        </div>
      </ng-template>


      <br>
      <div></div>
    </mat-card-content>
  </mat-card>

</div>
